# lat-tusd — photo upload server. Private (lat-tusd.flycast:8080), behind the
# proxy at /lat-uploads/*. Uploaded files persist on a volume.
#   Deploy: fly deploy deploy/fly/tusd -c deploy/fly/tusd/fly.toml
#   Volume: fly volumes create lat_tusd_data --size 3 -r lhr -a lat-tusd
#   Private IP: fly ips allocate-v6 --private -a lat-tusd
app = "lat-tusd"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # fly-proxy bridges flycast (IPv6) to the app's IPv4 listener; also
  # auto-starts this scale-to-zero machine on an inbound upload request.
  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"

[mounts]
  source = "lat_tusd_data"
  destination = "/srv/tusd-data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
