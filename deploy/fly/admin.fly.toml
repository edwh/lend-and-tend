# lat-admin — modtools-lat. Private (lat-admin.flycast:4003).
#   Deploy: fly deploy ./iznik-nuxt3 -c deploy/fly/admin.fly.toml
#   Private IP: fly ips allocate-v6 --private -a lat-admin
app = "lat-admin"
primary_region = "lhr"

[build]
  dockerfile = "admin/Dockerfile"

  # Baked into the build (modtools-lat/nuxt.config reads these at build time).
  [build.args]
    NODE_ENV = "production"
    IZNIK_API_V2 = "https://new.lendandtend.com/apiv2"
    LAT_WORLD_GROUPID = "1000000"

[env]
  NODE_ENV = "production"
  IZNIK_API_V2 = "https://new.lendandtend.com/apiv2"
  LAT_WORLD_GROUPID = "1000000"

[[services]]
  protocol = "tcp"
  internal_port = 4003
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # fly-proxy bridges flycast (IPv6) to the app's IPv4 listener.
  [[services.ports]]
    port = 4003
    handlers = ["http"]

  [[services.tcp_checks]]
    interval = "20s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
