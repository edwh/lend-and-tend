# lat-batch — Laravel scheduler/worker. No public port. This is the ONE service
# that can't scale to zero: it's a per-minute scheduler loop (there'd be nothing
# to wake it), so it runs always-on (fly scale count 1 -a lat-batch).
#   Deploy: fly deploy ./iznik-batch -c deploy/fly/batch.fly.toml
#   Secrets: fly secrets set DB_PASSWORD=… MAIL_PASSWORD=… LAT_BATCH_APP_KEY=… -a lat-batch
app = "lat-batch"
primary_region = "lhr"

[build]
  dockerfile = "../../iznik-batch/docker/Dockerfile"

# schedule:work runs the per-minute scheduler in the foreground — the same jobs
# the VM's `while true; schedule:run; sleep 60` loop runs (incl.
# queue:background-tasks for magic-link/notification emails and mail:spool:process).
[processes]
  worker = "php artisan schedule:work"

# Run migrations on every deploy (replaces the one-shot `batch` container).
[deploy]
  release_command = "php artisan migrate --force"

[env]
  # Never seed the demo users (incl. the hard-coded-password Admin account) in
  # production. Explicit, on top of the migration's own fail-safe gate.
  CREATE_DEMO_USERS = "false"
  DB_CONNECTION = "mysql"
  DB_HOST = "lat-mysql.internal"
  DB_PORT = "3306"
  DB_DATABASE = "lat"
  DB_USERNAME = "lat"
  REDIS_HOST = "lat-redis.flycast"
  REDIS_PORT = "6379"
  MJML_URL = "http://lat-mjml.flycast/"
  MJML_HTTP_TIMEOUT = "30"
  LAT_BATCH_ONLY = "true"
  LAT_WORLD_GROUPID = "1000000"
  FREEGLE_SITE_NAME = "Lend & Tend"
  FREEGLE_USER_SITE = "https://new.lendandtend.com"
  FREEGLE_NOREPLY_ADDR = "noreply@lendandtend.com"
  FREEGLE_SUPPORT_ADDR = "hello@lendandtend.com"
  FREEGLE_REGISTERED_ADDRESS = "Lend and Tend Limited, 62 Brown Street, Sheffield, S1 2BS"
  FREEGLE_EMAIL_TRACKING_ENABLED = "false"
  FREEGLE_MAIL_ENABLED_TYPES = "LatLoginLink,LatActivityAlert,LatCheckinReminder,LatMatchGoodNews,LatStillLooking,LatOtherGardens,LatMonthlyCheckin,LatWelcome"
  LAT_ASSET_BASE_URL = "https://new.lendandtend.com"
  FREEGLE_LOGO_URL = "https://new.lendandtend.com/images/lat/logo.png?v=2"
  MAIL_MAILER = "smtp"
  MAIL_HOST = "smtp.mailgun.org"
  MAIL_PORT = "587"
  MAIL_SCHEME = "smtp"
  MAIL_USERNAME = "lendandtend@mg.lendandtend.com"
  MAIL_FROM_ADDRESS = "noreply@lendandtend.com"
  MAIL_FROM_NAME = "Lend and Tend"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
